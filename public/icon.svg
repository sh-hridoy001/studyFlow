<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with squircle border -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.4"/>

  <!-- Glowing outer circular timer track -->
  <circle cx="256" cy="270" r="150" fill="none" stroke="#334155" stroke-width="16" opacity="0.6"/>
  <circle cx="256" cy="270" r="150" fill="none" stroke="url(#accent)" stroke-width="16" stroke-dasharray="700 240" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Top Timer Knob -->
  <rect x="238" y="70" width="36" height="24" rx="6" fill="url(#amberGlow)"/>
  <rect x="246" y="94" width="20" height="18" fill="#64748b"/>

  <!-- Inner Center Shield / Focus Target -->
  <circle cx="256" cy="270" r="110" fill="#0f172a" fill-opacity="0.85" stroke="#4f46e5" stroke-width="4"/>

  <!-- Graduation Cap Icon & Book Motif -->
  <!-- Cap Diamond -->
  <path d="M 256 200 L 336 240 L 256 280 L 176 240 Z" fill="url(#accent)" filter="url(#glow)"/>
  <!-- Cap Base / Skullcap -->
  <path d="M 206 255 L 206 295 Q 256 325 306 295 L 306 255 Q 256 280 206 255 Z" fill="#4338ca"/>
  <!-- Tassel -->
  <path d="M 326 246 L 340 286 L 346 320" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <circle cx="346" cy="324" r="6" fill="#fbbf24"/>

  <!-- 5-Prayer Star / Consistent Achievement Pip -->
  <polygon points="256,335 261,345 272,347 264,355 266,366 256,360 246,366 248,355 240,347 251,345" fill="#10b981"/>
</svg>
